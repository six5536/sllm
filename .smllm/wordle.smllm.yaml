# smllm Wordle: the user plays, the agent hosts, smllm keeps score. The secret
# is picked and every guess is scored by a command (.smllm/games/), so the
# host does not know the word either; six guesses, then it is over.
id: wordle
description: Wordle for the user (developer words, six guesses); you host, smllm scores.
initial: SHUFFLE

meta:
  smllm: 1
  instance:
    kind: game
  events:
    guess:
      description: Select with the player's guess, exactly as they gave it.
      params:
        type: object
        properties:
          word: { type: string, description: "Five letters.", pattern: "^[A-Za-z]{5}$" }
        required: [word]

states:
  # The machine picks the word, then goes straight to play.
  SHUFFLE:
    entry: { type: command, params: { run: "sh .smllm/games/wordle-pick.sh" } }
    always: PLAY

  PLAY:
    entry: { type: prompt, params: { file: prompts/wordle/play.md } }
    on:
      guess:
        - guard: { type: command, params: { run: "sh .smllm/games/wordle-score.sh" } }
          target: WON
        - guard: { type: visits, params: { state: PLAY, atLeast: 6 } }
          target: LOST
        - target: PLAY
          reenter: true

  WON:
    type: final
    entry:
      type: prompt
      params:
        text: |
          The player solved it! Show the board the way people share Wordle results: the title
          `smllm Wordle N/6`, then the rows from `.smllm/state/games/wordle/<the game id in the header>/board`.
          Congratulate them in one line on the guess that cracked it. Offer a rematch.

  LOST:
    type: final
    entry:
      type: prompt
      params:
        text: |
          Six guesses, no word. Show the board from
          `.smllm/state/games/wordle/<the game id in the header>/board`, then reveal the secret with
          `base64 -d < .smllm/state/games/wordle/<id>/secret`, and console the player in one line. Offer a rematch.
