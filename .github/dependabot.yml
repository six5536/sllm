version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn; majors stay separate so they
      # get read properly.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # No ignore rule is needed for dtolnay/rust-toolchain: the workflows no
    # longer reference it. Its tags are Rust toolchain names rather than action
    # releases, so Dependabot read `@1.96.0` as semver and bumped it to a
    # nonexistent Rust 1.100.0. The version now lives only in rust-toolchain.toml.
    groups:
      actions:
        patterns: ["*"]
