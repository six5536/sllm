name: Release

on:
  push:
    tags: ["v*"]

# Bypass sccache in CI.
env:
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight — a half-done
# publish is the worst outcome.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Is the tag coherent? Cheap checks first, so a typo fails in seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A semver prerelease has a hyphen after the patch component.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Tag matches every version in the tree
        run: node scripts/verify-version.mjs "${{ steps.v.outputs.version }}"

      - name: CHANGELOG has a section for this version
        run: |
          version='${{ steps.v.outputs.version }}'
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. The same gate CI runs. Releases are rare; pay for the full signal.
  # ---------------------------------------------------------------------------
  checks:
    needs: meta
    uses: ./.github/workflows/checks.yml

  # ---------------------------------------------------------------------------
  # 3. Build each platform binary.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.pkg }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships static musl: no glibc floor to track, and it runs on
          # Alpine too. zigbuild supplies the C cross-compiler and sysroot for
          # the musl targets, so a dependency with C code does not break the
          # cross build later.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64, builder: zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, pkg: linux-arm64, builder: zigbuild }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64, builder: cargo }
          # Windows builds natively on its own runner (msvc needs no cross
          # setup there). x64 only: Windows-on-ARM runs it under emulation, and
          # we never ship a binary no CI has executed.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Version comes from rust-toolchain.toml; only the cross target is added
      # here, since that is per-matrix-entry and not a property of the toolchain.
      - name: Install the pinned toolchain and cross target
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-zigbuild

      # Version read from .mise.toml so CI and local dev cross-compile with the
      # same zig, rather than the action defaulting to "latest".
      - name: Read the pinned zig version
        if: matrix.builder == 'zigbuild'
        id: zig
        run: |
          version="$(grep -oE '^zig = "[^"]+"' .mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$version" ]; then
            echo "::error::could not read the zig version from .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zig $version"

      # v2 or newer is required: Zig changed its tarball naming in 0.15 from
      # zig-<os>-<arch>-<ver> to zig-<arch>-<os>-<ver>, and v1 still builds the
      # old URL, so every mirror 404s.
      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p smllm

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }} -p smllm

      - name: Stage binary into platform package
        shell: bash
        run: |
          bin="smllm"
          case "${{ matrix.target }}" in *windows*) bin="smllm.exe" ;; esac
          install -m 0755 "target/${{ matrix.target }}/release/$bin" \
            "packages/smllm-${{ matrix.pkg }}/bin/$bin"

      - name: Assert Linux binaries are statically linked
        if: matrix.builder == 'zigbuild'
        run: |
          bin="packages/smllm-${{ matrix.pkg }}/bin/smllm"
          if readelf -l "$bin" | grep -q "program interpreter"; then
            echo "::error::$bin is dynamically linked; expected a static musl build"
            readelf -l "$bin" | grep "program interpreter"
            exit 1
          fi
          echo "$bin is static"

      # Behavioural smoke of the built artifact, on every target the runner
      # can execute: run the CLI and assert its output, JSON, and exit codes.
      # The aarch64 musl binary cannot run on the x64 ubuntu runner;
      # darwin-x64 runs on the arm64 runner via Rosetta.
      - name: Smoke-test the release binary
        if: matrix.pkg != 'linux-arm64'
        shell: bash
        run: |
          bin="packages/smllm-${{ matrix.pkg }}/bin/smllm"
          case "${{ matrix.target }}" in *windows*) bin="$bin.exe" ;; esac
          node scripts/release-smoke.mjs "$bin"

      # npm-pack the launcher and this platform package, then run the real
      # binary through the launcher. The launcher selects by the host's
      # platform/arch, so this runs only where the built package matches the
      # runner.
      - name: Smoke-test the npm launcher with the packed binary
        if: matrix.pkg == 'linux-x64' || matrix.pkg == 'darwin-arm64' || matrix.pkg == 'win32-x64'
        shell: bash
        run: node scripts/launcher-smoke.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: smllm-${{ matrix.pkg }}
          path: packages/smllm-${{ matrix.pkg }}/bin/smllm*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publish. Nothing here runs until the tag, the gate, and the builds agree.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [meta, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + automatic provenance
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NPM_TAG: ${{ needs.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal && rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: wasm-bindgen@0.2.128

      # packages/smllm-wasm is built here, from the tagged tree (NFR-8).
      - name: Build smllm-wasm
        run: |
          npm ci
          npm run build:wasm
          npm run test:wasm

      # Trusted publishing needs npm >= 11.5.1. Printed so a runner image with an
      # older npm is obvious in the log rather than silently falling back.
      - name: Show npm version
        run: npm --version

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place binaries into platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "artifacts/smllm-$pkg/smllm" "packages/smllm-$pkg/bin/smllm"
          done
          install -m 0755 "artifacts/smllm-win32-x64/smllm.exe" \
            "packages/smllm-win32-x64/bin/smllm.exe"

      - name: Smoke-test the built binary
        run: |
          actual="$(./packages/smllm-linux-x64/bin/smllm --version)"
          expected="smllm $VERSION"
          if [ "$actual" != "$expected" ]; then
            echo "::error::binary reports '$actual', expected '$expected'"
            exit 1
          fi
          echo "$actual"

      - name: Dry-run every publish before doing any of them
        run: |
          cargo publish --workspace --locked --dry-run
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/smllm-$pkg" --dry-run --tag "$NPM_TAG"
          done
          npm publish ./packages/smllm --dry-run --tag "$NPM_TAG"
          npm publish ./packages/smllm-wasm --dry-run --tag "$NPM_TAG"

      # Authentication is npm trusted publishing (OIDC) via `id-token: write`;
      # there is no NPM_TOKEN. Provenance is generated automatically under OIDC,
      # so no --provenance flag is needed.
      #
      # Platform packages first: the launcher declares them as
      # optionalDependencies, so publishing it first would briefly point users at
      # versions that do not exist yet.
      - name: Publish platform packages to npm
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/smllm-$pkg" --tag "$NPM_TAG"
          done

      - name: Publish launcher to npm
        run: npm publish ./packages/smllm --tag "$NPM_TAG"

      - name: Publish smllm-wasm to npm
        run: npm publish ./packages/smllm-wasm --tag "$NPM_TAG"

      # `--workspace` resolves the internal crate ordering itself (smllm-core →
      # smllm-format → smllm; agent-harness-kit → smllm), so no sleep-and-hope
      # between publishes. smllm-wasm is `publish = false`: it ships on npm.
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

  # ---------------------------------------------------------------------------
  # 5. GitHub Release: archives, checksums, notes.
  # ---------------------------------------------------------------------------
  github-release:
    name: github release
    needs: [meta, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate man page and completions
        run: |
          mkdir -p dist/share
          cargo build --release --locked -p smllm
          ./target/release/smllm man > dist/share/smllm.1
          for shell in bash zsh fish powershell elvish; do
            ./target/release/smllm completions "$shell" > "dist/share/smllm.$shell"
          done

      - name: Build archives and checksums
        run: |
          mkdir -p dist/out
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            stage="dist/stage/smllm-$VERSION-$pkg"
            mkdir -p "$stage"
            install -m 0755 "artifacts/smllm-$pkg/smllm" "$stage/smllm"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            cp -r dist/share "$stage/share"
            tar -czf "dist/out/smllm-$VERSION-$pkg.tar.gz" -C dist/stage "smllm-$VERSION-$pkg"
          done
          # Windows ships a .zip, the archive form its users expect.
          stage="dist/stage/smllm-$VERSION-win32-x64"
          mkdir -p "$stage"
          install -m 0755 "artifacts/smllm-win32-x64/smllm.exe" "$stage/smllm.exe"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp -r dist/share "$stage/share"
          (cd dist/stage && zip -qr "../out/smllm-$VERSION-win32-x64.zip" "smllm-$VERSION-win32-x64")
          cd dist/out && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS && cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          # The section for this version, up to the next "## " heading — or the
          # trailing link-reference definitions, which are markdown plumbing and
          # do not belong in release notes.
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::no release notes found for $VERSION in CHANGELOG.md"
            exit 1
          fi
          cat dist/notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: dist/notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/SHA256SUMS
