[package]
name = "sllm"
description = "A skeleton Rust CLI, shipped by a complete release pipeline."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sllm"
path = "src/main.rs"

[lints.rust]
# `coverage_nightly` is set by cargo-llvm-cov under the nightly coverage job; it
# is an expected cfg, not a typo, on every other toolchain.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[dependencies]
sllm-core.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
